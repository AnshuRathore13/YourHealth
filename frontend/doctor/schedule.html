<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Schedule — YourHealth.AI</title>
  <link rel="stylesheet" href="../assets/css/design-system.css">
  <link rel="stylesheet" href="../assets/css/portal.css">
  <style>
    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }
    .week-day-col {
      min-height: 400px;
    }
    .week-day-header {
      text-align: center;
      padding: 10px 4px;
      border-radius: 12px;
      margin-bottom: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-3);
    }
    .week-day-header.today {
      background: var(--accent-dim);
      border: 1px solid rgba(74,142,245,0.2);
      color: var(--accent);
    }
    .week-apt-block {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
      margin-bottom: 6px;
      font-size: 0.72rem;
      cursor: pointer;
      transition: all var(--t-fast);
      border-left: 3px solid var(--accent);
    }
    .week-apt-block:hover { transform: scale(1.02); box-shadow: var(--shadow-sm); }
    .week-apt-block.high   { border-left-color: var(--red); }
    .week-apt-block.medium { border-left-color: var(--amber); }
    .week-apt-block.low    { border-left-color: var(--green); }
    .week-apt-block .apt-patient { font-weight: 700; color: var(--text); margin-bottom: 2px; white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .week-apt-block .apt-time    { color: var(--text-3); }
  </style>
</head>
<body>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="portal-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <span class="logo-dot" style="background:var(--green);box-shadow:0 0 8px var(--green);"></span>
      YourHealth<span style="color:var(--green)">.</span>AI
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="sidebar-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
      <a href="schedule.html" class="sidebar-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2z"/></svg>My Schedule</a>
      <a href="#" class="sidebar-item" onclick="Toast.info('Coming Soon', 'This module will be available in V2.')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>My Patients</a>
      <a href="prescriptions.html" class="sidebar-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4M7 3h10a2 2 0 012 2v14a2 2 0 01-2 2H7a2 2 0 01-2-2V5a2 2 0 012-2z"/></svg>Prescriptions</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user" onclick="Auth.logout()">
        <div class="avatar" id="user-avatar" style="background:var(--green-dim);color:var(--green);">D</div>
        <div><div style="font-size:0.85rem;font-weight:600;" id="user-name">Doctor</div><div style="font-size:0.72rem;color:var(--text-3);">Log out</div></div>
      </div>
    </div>
  </aside>

  <main class="portal-main">
    <header class="portal-header">
      <div style="display:flex;align-items:center;gap:14px;">
        <button class="btn btn-ghost btn-sm" id="sidebar-toggle" style="padding:8px;border-radius:10px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div>
          <div class="page-title" style="font-size:1.2rem;">My Schedule</div>
          <div class="page-subtitle" id="week-label">This Week</div>
        </div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;">
        <button onclick="changeWeek(-1)" class="btn btn-outline btn-sm">← Prev</button>
        <button onclick="changeWeek(0)"  class="btn btn-ghost btn-sm">Today</button>
        <button onclick="changeWeek(1)"  class="btn btn-outline btn-sm">Next →</button>
      </div>
    </header>

    <div class="portal-content">
      <!-- Weekly view -->
      <div class="week-grid" id="week-grid">
        <!-- Populated by JS -->
      </div>

      <!-- Working hours config -->
      <div style="margin-top:28px;" class="card-dark">
        <div style="font-size:0.95rem;font-weight:700;margin-bottom:14px;">⚙️ Working Hours & Slot Duration</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;">
          <div class="form-group">
            <label class="form-label">Start Time</label>
            <input class="form-input" type="time" id="work-start" value="09:00">
          </div>
          <div class="form-group">
            <label class="form-label">End Time</label>
            <input class="form-input" type="time" id="work-end" value="17:00">
          </div>
          <div class="form-group">
            <label class="form-label">Slot Duration (mins)</label>
            <select class="form-select form-input" id="slot-dur">
              <option value="15">15 minutes</option>
              <option value="20">20 minutes</option>
              <option value="30" selected>30 minutes</option>
              <option value="45">45 minutes</option>
              <option value="60">60 minutes</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Break (lunch)</label>
            <input class="form-input" type="time" id="break-start" value="13:00">
          </div>
        </div>
        <button onclick="saveWorkingHours()" class="btn btn-sm" style="margin-top:12px;background:var(--green);color:#080810;font-weight:700;">Save Working Hours</button>
      </div>
    </div>
  </main>
</div>

<div class="toast-container"></div>
<script src="../assets/js/api.js"></script>
<script>
  if (!Auth.requireRole('doctor')) {}
  const user = Auth.user;
  if (user) {
    document.getElementById('user-name').textContent = user.firstName || user.name;
    document.getElementById('user-avatar').textContent = (user.firstName?.[0] || 'D').toUpperCase();
  }

  let weekOffset = 0;

  function getWeekDates(offset) {
    const today = new Date();
    const startOfWeek = new Date(today);
    startOfWeek.setDate(today.getDate() - today.getDay() + (offset * 7));
    return Array.from({length:7}, (_,i) => {
      const d = new Date(startOfWeek);
      d.setDate(startOfWeek.getDate() + i);
      return d;
    });
  }

  async function renderWeek() {
    const dates = getWeekDates(weekOffset);
    const today = new Date(); today.setHours(0,0,0,0);
    const grid = document.getElementById('week-grid');

    const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const start = dates[0].toLocaleDateString('en-IN',{day:'numeric',month:'short'});
    const end   = dates[6].toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
    document.getElementById('week-label').textContent = `${start} — ${end}`;

    // Load schedule data for entire week
    let scheduleData = {};
    try {
      for (const d of dates) {
        const key = d.toISOString().split('T')[0];
        const res = await api.doctor.schedule(key);
        scheduleData[key] = res.data || res || [];
      }
    } catch {
      // Use mock
      const todayKey = today.toISOString().split('T')[0];
      scheduleData[todayKey] = MOCK_SCHEDULE;
    }

    grid.innerHTML = dates.map((d, i) => {
      const key = d.toISOString().split('T')[0];
      const apts = scheduleData[key] || [];
      const isToday = d.toDateString() === today.toDateString();
      return `
        <div class="week-day-col">
          <div class="week-day-header ${isToday?'today':''}">
            <div>${dayNames[i]}</div>
            <div style="font-size:1rem;font-weight:800;letter-spacing:-0.04em;margin-top:2px;">${d.getDate()}</div>
          </div>
          ${apts.length ? apts.map(apt => {
            const urgLevel = (apt.urgency||'Low').toLowerCase();
            const t = new Date(apt.datetime||apt.date);
            const h12 = ((t.getHours()%12)||12)+':'+String(t.getMinutes()).padStart(2,'0')+(t.getHours()>=12?' PM':' AM');
            return `<div class="week-apt-block ${urgLevel}">
              <div class="apt-patient">${apt.patientName||'Patient'}</div>
              <div class="apt-time">${h12}</div>
            </div>`;
          }).join('') : `<div style="text-align:center;padding:20px 0;font-size:0.72rem;color:var(--text-3);">—</div>`}
        </div>`;
    }).join('');
  }

  function changeWeek(dir) {
    weekOffset = dir === 0 ? 0 : weekOffset + dir;
    renderWeek();
  }

  async function saveWorkingHours() {
    Toast.success('Saved', 'Working hours updated. New slots generated accordingly.');
  }

  const MOCK_SCHEDULE = [
    { id:1, datetime:new Date().toISOString(), patientName:'Aarav Shah', urgency:'High' },
    { id:2, datetime:new Date(Date.now()+3600000).toISOString(), patientName:'Priya Patel', urgency:'Medium' },
  ];

  renderWeek();
</script>
</body>
</html>
